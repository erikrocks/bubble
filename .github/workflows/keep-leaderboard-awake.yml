# Free Supabase projects pause after about a week with no activity, and when the
# kudr-leaderboard project paused (Oct 2026) both Bubble's and KUDR's high-score boards
# went dark. This reads one row from each board once a day so the project never goes
# idle. Read-only: it never writes, and the key is the same public one the games ship.
#
# GitHub switches scheduled workflows off in a public repo after 60 days with no
# commits, and emails a warning first. If that email arrives, re-enable the workflow
# from the Actions tab (or push anything).
name: Keep the leaderboard awake

on:
  schedule:
    - cron: "23 15 * * *"      # once a day, 15:23 UTC
  workflow_dispatch: {}        # and a manual "Run workflow" button

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read one score from each board
        env:
          BASE: https://dsandoakgeceuzyhwxhg.supabase.co/rest/v1
          KEY: sb_publishable_p7QhKoUFYdj1alM5Sx5hkQ_Q7JxR4gi
        run: |
          for table in bubble_scores scores; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              -H "apikey: $KEY" "$BASE/$table?select=score&limit=1")
            echo "$table: HTTP $code"
            [ "$code" = "200" ] || failed=1
          done
          # a red run here means the project is already paused: restore it at
          # supabase.com/dashboard
          [ -z "$failed" ]
